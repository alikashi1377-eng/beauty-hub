<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#0D256C" />
      <stop offset="55%" stop-color="#061238" />
      <stop offset="100%" stop-color="#02081D" />
    </radialGradient>

    <radialGradient id="centerAura" cx="50%" cy="50%" r="46%">
      <stop offset="0%" stop-color="#0057FF" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#00E5FF" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#02081D" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="tTopGrad" x1="68" y1="110" x2="310" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#0038A8" />
    </linearGradient>

    <linearGradient id="tStemGrad" x1="176" y1="130" x2="176" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="55%" stop-color="#0057FF" />
      <stop offset="100%" stop-color="#002B80" />
    </linearGradient>

    <linearGradient id="ringOuterGrad" x1="210" y1="135" x2="438" y2="395" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="45%" stop-color="#0088FF" />
      <stop offset="100%" stop-color="#0044CC" />
    </linearGradient>

    <linearGradient id="clockFaceGrad" x1="240" y1="175" x2="405" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#081A4B" />
      <stop offset="100%" stop-color="#030B24" />
    </linearGradient>

    <linearGradient id="handGrad" x1="285" y1="220" x2="368" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>

  <!-- پس‌زمینه کامل بدون بریدگی گوشه برای سازگاری ۱۰۰٪ با آیکون‌های دایره‌ای، چهارگوش و Maskable تمام گوشی‌ها -->
  <rect width="512" height="512" fill="url(#bgGlow)" />
  <circle cx="256" cy="256" r="220" fill="url(#centerAura)" />

  <!-- گروه لوگو با مقیاس استاندارد در محدوده امن (Safe Zone) مرکزی -->
  <g transform="translate(256, 256) scale(0.72) translate(-255, -256)">
    <!-- ۱. حلقه بیرونی ساعت -->
    <circle
      cx="322"
      cy="268"
      r="120"
      fill="url(#clockFaceGrad)"
      stroke="url(#ringOuterGrad)"
      stroke-width="26"
    />

    <!-- حلقه نوری ظریف داخلی ساعت -->
    <circle
      cx="322"
      cy="268"
      r="92"
      fill="none"
      stroke="#38BDF8"
      stroke-opacity="0.32"
      stroke-width="3.5"
    />

    <!-- ۲. نشانگرهای ۱۲ ساعت روی صفحه ساعت -->
    <g stroke="#38BDF8" stroke-linecap="round">
      <line x1="322" y1="184" x2="322" y2="196" stroke-width="6" stroke="#67E8F9" />
      <line x1="406" y1="268" x2="394" y2="268" stroke-width="6" stroke="#67E8F9" />
      <line x1="322" y1="352" x2="322" y2="340" stroke-width="6" stroke="#67E8F9" />
      <line x1="238" y1="268" x2="250" y2="268" stroke-width="6" stroke="#67E8F9" />
      <line x1="364" y1="195" x2="359" y2="204" stroke-width="4" stroke-opacity="0.75" />
      <line x1="395" y1="226" x2="386" y2="231" stroke-width="4" stroke-opacity="0.75" />
      <line x1="395" y1="310" x2="386" y2="305" stroke-width="4" stroke-opacity="0.75" />
      <line x1="364" y1="341" x2="359" y2="332" stroke-width="4" stroke-opacity="0.75" />
      <line x1="280" y1="341" x2="285" y2="332" stroke-width="4" stroke-opacity="0.75" />
      <line x1="249" y1="310" x2="258" y2="305" stroke-width="4" stroke-opacity="0.75" />
      <line x1="249" y1="226" x2="258" y2="231" stroke-width="4" stroke-opacity="0.75" />
      <line x1="280" y1="195" x2="285" y2="204" stroke-width="4" stroke-opacity="0.75" />
    </g>

    <!-- ۳. عقربه‌های ساعت -->
    <path
      d="M286 242 L322 268 L368 236"
      stroke="url(#handGrad)"
      stroke-width="14"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="322" cy="268" r="10" fill="#67E8F9" />
    <circle cx="322" cy="268" r="4.5" fill="#040D2A" />

    <!-- ۴. حرف T سه بعدی -->
    <rect
      x="144"
      y="148"
      width="64"
      height="254"
      rx="28"
      fill="#02081D"
      opacity="0.75"
      transform="translate(8, 10)"
    />
    <rect
      x="144"
      y="144"
      width="64"
      height="258"
      rx="28"
      fill="url(#tStemGrad)"
      stroke="#38BDF8"
      stroke-opacity="0.45"
      stroke-width="2.5"
    />
    <path
      d="M84 110 H282 C296 110 306 121 302 135 L294 162 C291 172 282 178 271 178 H68 C56 178 47 167 51 155 L61 124 C64 115 73 110 84 110 Z"
      fill="url(#tTopGrad)"
      stroke="#7DD3FC"
      stroke-opacity="0.55"
      stroke-width="2.5"
    />
    <path
      d="M84 116 H276"
      stroke="#BAE6FD"
      stroke-opacity="0.65"
      stroke-width="4"
      stroke-linecap="round"
    />
  </g>
</svg>
